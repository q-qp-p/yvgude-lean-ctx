[graph]
targets = []
all-features = true

[advisories]
# cargo-deny >= 0.19 removed `vulnerability` and `notice` config knobs:
# all vulnerability/notice advisories now emit errors unless explicitly ignored.
# `unmaintained`/`unsound` now control which dependencies can fail the check.
# cargo-deny treats `all` as the strict equivalent of a deny policy.
unmaintained = "all"
# arrayref 0.3.10 was a supply-chain attack (proc-macro1 typosquat executing
# a remote payload at build time). crates.io removed 0.3.10; versions 0.3.5–0.3.9
# are yanked but safe. blake3 ^1.8 requires arrayref ^0.3.5, so we pin 0.3.9
# via Cargo.lock. "warn" instead of "deny" until upstream un-yanks or publishes
# a clean release.  See: https://github.com/nickelc/arrayref-attack-analysis
yanked = "warn"
unused-ignored-advisory = "warn"
ignore = [
    # Transitive deps — no direct replacement available yet:
    "RUSTSEC-2023-0089", # atomic-polyfill (transitive via hash32/heapless)
    "RUSTSEC-2024-0436", # paste (transitive, awaiting upstream migration)
    "RUSTSEC-2026-0192", # ttf-parser (transitive via pdf-extract→lopdf, no safe upgrade)
]

[licenses]
# The allow-list below is a deliberately curated, forward-looking policy. Some
# entries (e.g. OpenSSL for `ring`, Unicode-DFS-2016) are kept so dependency
# bumps don't trip the check; `allow` silences the pedantic "not encountered"
# notice for those without weakening the policy itself.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "Unlicense",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "bzip2-1.0.6",
    "WTFPL",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []


