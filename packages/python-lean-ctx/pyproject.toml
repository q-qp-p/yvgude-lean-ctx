[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-ctx-python"
version = "1.0.0"
description = "SDK for lean-ctx — context compression and execution evidence for AI agents"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = []
keywords = ["llm", "context", "compression", "evidence", "ai", "mcp"]
authors = [{name = "Yves Gugger", email = "yves@thinkery.ai"}]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Software Development :: Libraries",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://leanctx.com"
Repository = "https://github.com/yvgude/lean-ctx"
Documentation = "https://github.com/yvgude/lean-ctx/tree/main/packages/python-lean-ctx"
Issues = "https://github.com/yvgude/lean-ctx/issues"

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]
llamaindex = ["llama-index-core>=0.10"]
litellm = ["litellm>=1.0"]
openai-agents = ["openai-agents>=0.19.4,<0.20.0"]
verify = ["cryptography>=42.0"]
all = [
  "langchain-core>=0.2",
  "llama-index-core>=0.10",
  "litellm>=1.0",
  "openai-agents>=0.19.4,<0.20.0",
  "cryptography>=42.0",
]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["lean_ctx*"]
